name: classora_mobile
description: "Classora 2.0 Mobile App (Flutter)"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2
  
  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  
  # Networking & Storage
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  
  # Data Modeling
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  livekit_client: ^2.11.0
  flutter_webrtc: ^1.6.0
  socket_io_client: ^3.1.6
  file_picker: ^10.2.4
  video_player: ^2.11.1
  webview_flutter: ^4.14.1
  path_provider: ^2.1.6
  flutter_pdfview: ^1.4.5
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
